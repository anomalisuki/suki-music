<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Suki Music</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">♪</div>
        <div>
          <h1>Suki Music</h1>
          <p>Search &amp; play music</p>
        </div>
      </div>
    </header>

    <section class="search-box">
      <form id="searchForm">
        <input
          id="query"
          type="search"
          autocomplete="off"
          placeholder="Cari lagu, artis, album..."
          aria-label="Cari lagu"
          required
        >
        <button id="searchButton" type="submit">Cari</button>
      </form>
    </section>

    <div id="status" class="status hidden"></div>

    <section id="results" class="results"></section>

    <section id="empty" class="empty">
      <div class="empty-icon">♫</div>
      <h2>Cari lagu</h2>
      <p>Masukkan judul lagu atau nama artis untuk mulai.</p>
    </section>
  </main>

  <div id="playerBar" class="player-bar hidden">
    <div class="now-playing">
      <img id="playerThumb" src="" alt="">
      <div class="now-text">
        <strong id="playerTitle">-</strong>
        <span id="playerArtist">-</span>
      </div>
    </div>

    <audio id="audioPlayer" controls preload="none"></audio>

    <button id="closePlayer" class="close-player" type="button" aria-label="Tutup player">×</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
